apiVersion: v1
kind: ServiceAccount
metadata:
  name: minecraft-watchdog
  namespace: minecraft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minecraft-watchdog
  namespace: minecraft
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minecraft-watchdog
  namespace: minecraft
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: minecraft-watchdog
subjects:
  - kind: ServiceAccount
    name: minecraft-watchdog
    namespace: minecraft
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minecraft-watchdog
  namespace: minecraft
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: minecraft-watchdog
          restartPolicy: OnFailure
          containers:
            - name: watchdog
              image: alpine/k8s:1.32.1
              command:
                - /bin/bash
                - -ec
                - |
                  READY=$(kubectl get pod -n minecraft -l app=minecraft \
                    -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "false")

                  if [[ "${READY}" != "true" ]]; then
                    echo "ALERT: Minecraft pod is NOT ready"
                    exit 1
                  fi

                  FAILED=$(kubectl get jobs -n minecraft \
                    -o jsonpath='{range .items[?(@.status.failed>=1)]}{.metadata.name}{"\n"}{end}' \
                    | grep -E '^backup|^minecraft-world-backup' | head -1 || true)

                  if [[ -n "${FAILED}" ]]; then
                    echo "ALERT: Backup job failed: ${FAILED}"
                    exit 1
                  fi

                  echo "OK: Minecraft pod ready, no recent backup failures"
