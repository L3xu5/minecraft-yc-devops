apiVersion: batch/v1
kind: CronJob
metadata:
  name: minecraft-world-backup
  namespace: minecraft
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: minecraft-backup
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: amazon/aws-cli:2.15.30
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: minecraft-secrets
                      key: s3-access-key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minecraft-secrets
                      key: s3-secret-key
                - name: AWS_DEFAULT_REGION
                  value: ru-central1
                - name: S3_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: minecraft-backup-config
                      key: bucket-name
                - name: RCON_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: minecraft-secrets
                      key: rcon-password
              command:
                - /bin/bash
                - -ec
                - |
                  curl -fsSL -o /usr/local/bin/kubectl \
                    "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl"
                  chmod +x /usr/local/bin/kubectl

                  POD=$(kubectl get pod -n minecraft -l app=minecraft \
                    -o jsonpath='{.items[0].metadata.name}')

                  echo "Saving world on pod ${POD}..."
                  kubectl exec -n minecraft "${POD}" -c minecraft -- \
                    rcon-cli --password "${RCON_PASSWORD}" save-all

                  BACKUP="world-$(date -u +%Y%m%d-%H%M%S).tar.gz"
                  echo "Uploading ${BACKUP} to s3://${S3_BUCKET}/"

                  kubectl exec -n minecraft "${POD}" -c minecraft -- \
                    tar czf - -C /data world \
                    | aws s3 cp - "s3://${S3_BUCKET}/${BACKUP}" \
                      --endpoint-url https://storage.yandexcloud.net

                  echo "Backup complete: ${BACKUP}"
