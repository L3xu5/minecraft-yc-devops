apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/L3xu5/minecraft-yc-devops.git
    targetRevision: main
    path: helm/minecraft
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: backup.bucketName
          value: minecraft-world-backup-b1gqbqg5
  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
