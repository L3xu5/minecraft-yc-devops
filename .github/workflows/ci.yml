name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

env:
  TF_DIR: terraform/envs/dev
  HELM_CHART: helm/minecraft
  REGISTRY_ID: crpb50888jld38d5pg5r
  IMAGE: cr.yandex/crpb50888jld38d5pg5r/minecraft-server:latest

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.0

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          tofu init -backend=false
          tofu validate

      - name: Helm lint
        run: |
          helm lint ${{ env.HELM_CHART }}
          helm template minecraft ${{ env.HELM_CHART }} -f ${{ env.HELM_CHART }}/values-prod.yaml > /tmp/minecraft.yaml

  build-image:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authenticate to Yandex Cloud
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          printf '%s' "${YC_SA_JSON_CREDENTIALS}" > sa-key.json
          yc config set service-account-key sa-key.json
          yc config set folder-id "${YC_FOLDER_ID}"
          rm -f sa-key.json

      - name: Build and push image to YCR
        run: |
          yc container registry configure-docker
          docker build -t "${{ env.IMAGE }}" docker/
          docker push "${{ env.IMAGE }}"

  sync-gitops:
    needs: build-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Install Argo CD CLI
        run: |
          curl -sSL -o /tmp/argocd https://github.com/argoproj/argo-cd/releases/download/v3.4.2/argocd-linux-amd64
          chmod +x /tmp/argocd
          sudo mv /tmp/argocd /usr/local/bin/argocd

      - name: Authenticate to Yandex Cloud
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          printf '%s' "${YC_SA_JSON_CREDENTIALS}" > sa-key.json
          yc config set service-account-key sa-key.json
          yc config set folder-id "${YC_FOLDER_ID}"
          rm -f sa-key.json
          yc managed-kubernetes cluster get-credentials --name minecraft-k8s --external --force

      - name: Sync Argo CD applications
        run: |
          kubectl apply -f argocd/applications/platform-root.yaml
          for app in minecraft external-secrets kube-prometheus fluent-bit velero; do
            argocd app sync "$app" --core --prune || true
          done
          argocd app wait minecraft --core --health --timeout 600
