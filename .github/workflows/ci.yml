name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

env:
  TF_DIR: terraform/envs/dev
  HELM_CHART: helm/minecraft

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.0

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          tofu init -backend=false
          tofu validate

      - name: Helm lint
        run: |
          helm lint ${{ env.HELM_CHART }}
          helm template minecraft ${{ env.HELM_CHART }} -f ${{ env.HELM_CHART }}/values-prod.yaml > /tmp/minecraft.yaml
          kubectl apply --dry-run=client -f /tmp/minecraft.yaml 2>/dev/null || true

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.0

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure Yandex Cloud
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          if [[ -n "${YC_SA_JSON_CREDENTIALS}" ]]; then
            echo "${YC_SA_JSON_CREDENTIALS}" > sa-key.json
            yc config set service-account-key sa-key.json
            rm -f sa-key.json
          elif [[ -n "${YC_TOKEN}" ]]; then
            export YC_TOKEN
            yc config set token "${YC_TOKEN}"
          else
            echo "Set YC_SA_JSON_CREDENTIALS or YC_TOKEN in repository secrets"
            exit 1
          fi
          yc config set folder-id "${YC_FOLDER_ID}"

      - name: Deploy Minecraft Helm chart
        env:
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          BACKUP_BUCKET: minecraft-world-backup-b1gqbqg5
        run: |
          yc managed-kubernetes cluster get-credentials --name minecraft-k8s --external --force
          helm upgrade --install minecraft ${{ env.HELM_CHART }} \
            -n minecraft --create-namespace \
            -f ${{ env.HELM_CHART }}/values-prod.yaml \
            --set backup.bucketName="${BACKUP_BUCKET}" \
            --set persistence.existingClaim=minecraft-data \
            --wait --timeout 10m
          kubectl get svc minecraft -n minecraft
