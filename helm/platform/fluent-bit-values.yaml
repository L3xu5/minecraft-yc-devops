# Fluent Bit → Yandex Cloud Logging (yc-logging plugin)
# group_id подставляется deploy-v2.sh

config:
  service: |
    [SERVICE]
        Flush        1
        Daemon       Off
        Log_Level    info
        Parsers_File parsers.conf
        HTTP_Server  On
        HTTP_Listen  0.0.0.0
        HTTP_Port    2020

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            docker
        Tag               kube.*
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
        Name            yc-logging
        Match           *
        group_id        LOG_GROUP_ID_PLACEHOLDER
        message_key     log
        level_key       severity
        default_level   INFO
        authorization   instance-service-account

serviceAccount:
  create: true
  name: fluent-bit-logging

rbac:
  create: true

tolerations:
  - operator: Exists
