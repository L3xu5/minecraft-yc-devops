# kube-prometheus-stack — Grafana только port-forward (квота NLB)
grafana:
  enabled: true
  adminPassword: changeme-grafana
  service:
    type: ClusterIP
    port: 80
  persistence:
    enabled: false

prometheus:
  enabled: true
  prometheusSpec:
    retention: 7d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true

defaultRules:
  create: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
