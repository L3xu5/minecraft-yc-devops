image:
  repository: cr.yandex/crpb50888jld38d5pg5r/minecraft-server
  tag: latest
  pullPolicy: Always

persistence:
  existingClaim: minecraft-data

minecraft:
  onlineMode: false
  type: PAPER
  memory: 52G
  maxPlayers: 10

backup:
  enabled: true
  bucketName: minecraft-world-backup-b1gqbqg5

watchdog:
  enabled: true

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true

# 64 GB node: ~57 Gi allocatable − platform pods → 52G heap / 54Gi limit
resources:
  requests:
    cpu: "3"
    memory: 52Gi
  limits:
    cpu: "4"
    memory: 54Gi
