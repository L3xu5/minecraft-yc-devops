image:
  repository: cr.yandex/crpb50888jld38d5pg5r/minecraft-server
  tag: latest
  pullPolicy: Always

persistence:
  existingClaim: minecraft-data

minecraft:
  onlineMode: false
  type: PAPER
  memory: 58G
  maxPlayers: 10

backup:
  enabled: true
  bucketName: minecraft-world-backup-b1gqbqg5

watchdog:
  enabled: true

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true

# 64 GB node (max standard-v3 4 vCPU): ~60 Gi allocatable − platform → 60 Gi pod, heap 58G
resources:
  requests:
    cpu: "4"
    memory: 60Gi
  limits:
    cpu: "4"
    memory: 60Gi
