apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minecraft.fullname" . }}
  labels:
    {{- include "minecraft.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "minecraft.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minecraft.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: minecraft
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          env:
            - name: EULA
              value: "TRUE"
            - name: ONLINE_MODE
              value: {{ ternary "TRUE" "FALSE" .Values.minecraft.onlineMode | quote }}
            - name: TYPE
              value: {{ .Values.minecraft.type | quote }}
            - name: MEMORY
              value: {{ .Values.minecraft.memory | quote }}
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: rcon-password
            - name: SPAWN_PROTECTION
              value: {{ .Values.minecraft.spawnProtection | quote }}
            - name: DIFFICULTY
              value: {{ .Values.minecraft.difficulty | quote }}
            - name: MAX_PLAYERS
              value: {{ .Values.minecraft.maxPlayers | quote }}
            {{- if .Values.minecraft.version }}
            - name: VERSION
              value: {{ .Values.minecraft.version | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 120
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default "minecraft-data" }}
